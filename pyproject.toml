[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bestman-flexiv"
version = "0.3.2"
description = "Rizon 4/4R control with Flexiv RDK 1.9.3"
requires-python = ">=3.10"
dependencies = ["flexivrdk==1.9.3", "numpy>=1.24", "scipy>=1.14", "ikpy>=3.4,<5"]

[project.optional-dependencies]
gripper = ["pyRobotiqGripper", "pyserial", "minimalmodbus"]
camera = ["pyrealsense2", "opencv-python"]
dev = ["pytest>=7", "ruff>=0.9"]

[tool.setuptools]
packages = ["Robotics_API", "Asset", "Examples", "Sensor"]

[tool.setuptools.package-data]
Asset = ["flexiv_rizon4_kinematics.urdf", "flexiv_rizon4r_kinematics.urdf", "README.md", "LICENSE.flexiv_description"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
include = ["Robotics_API/*.py", "Examples/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
